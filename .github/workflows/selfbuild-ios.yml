name: Self-build iOS (Xcode 27.1, unsigned)

on:
  push:
  workflow_dispatch:
    inputs:
      configurations:
        default: '["Release"]'
      heap:
        description: Gradle -Xmx, e.g. 12g (relies on swap on the 7 GB runner)
        default: ""
      testflight_run_id:
        description: Instead of building, sign this run's Raft-Release artifact and upload it to TestFlight
        default: ""

jobs:
  build:
    if: ${{ !inputs.testflight_run_id }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.configurations || '["Release"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Xcode and SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Gradle heap
        env:
          HEAP: ${{ inputs.heap || '12g' }}
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx$HEAP -Xss4m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\\=\"-Xmx$HEAP,-Xss4m\"" >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties

      - name: Shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      - name: Build for iPhone (${{ matrix.configuration }}, unsigned)
        working-directory: compose/iosApp
        run: |
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration ${{ matrix.configuration }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            build > "$GITHUB_WORKSPACE/xcodebuild.log" 2>&1 || true
          tail -30 "$GITHUB_WORKSPACE/xcodebuild.log"
          grep -q "BUILD SUCCEEDED" "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Errors
        if: failure()
        run: |
          grep -nE "(^|[[:space:]])e: |: error:|FAILURE:|Execution failed|OutOfMemory" xcodebuild.log | grep -v "Using response file" | tail -80 || true

      - name: Zip app
        run: |
          app=compose/iosApp/build/DerivedData/Build/Products/${{ matrix.configuration }}-iphoneos/iosApp.app
          ditto -c -k --keepParent "$app" "Raft-${{ matrix.configuration }}.zip"
          ls -lh "Raft-${{ matrix.configuration }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Raft-${{ matrix.configuration }}
          path: Raft-${{ matrix.configuration }}.zip
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcodebuild-log-${{ matrix.configuration }}
          path: xcodebuild.log
          retention-days: 1

  # App Store signing for internal TestFlight (anyRaft, dev.vgent.raft.app): the unsigned app from
  # a build run, re-signed like install-on-iphone.sh, then uploaded with the App Store Connect key.
  testflight:
    if: ${{ inputs.testflight_run_id }}
    runs-on: xcode-27
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Raft-Release
          run-id: ${{ inputs.testflight_run_id }}
          github-token: ${{ github.token }}

      - name: Sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          key_id=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')
          issuer=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')
          kc="$RUNNER_TEMP/dist.keychain-db"
          kcpw=$(uuidgen)
          printf %s "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -P "$(printf %s "$DIST_P12_PASSWORD" | tr -d '[:space:]')" -A -t cert -f pkcs12 -k "$kc"
          security list-keychain -d user -s "$kc" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto -x -k Raft-Release.zip "$RUNNER_TEMP/ipa/Payload"
          app="$RUNNER_TEMP/ipa/Payload/iosApp.app"
          printf %s "$APPSTORE_PROFILE_BASE64" | base64 --decode > "$app/embedded.mobileprovision"
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/ent.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier dev.vgent.raft.app" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName anyRaft" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$app/Info.plist"
          find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 2>/dev/null |
            while IFS= read -r -d '' f; do codesign -f -s "Apple Distribution" --keychain "$kc" "$f"; done
          codesign -f -s "Apple Distribution" --keychain "$kc" --entitlements "$RUNNER_TEMP/ent.plist" "$app"
          codesign --verify --deep --strict "$app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry anyRaft.ipa Payload)

          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$key_id.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/ipa/anyRaft.ipa" -t ios --apiKey "$key_id" --apiIssuer "$issuer"
