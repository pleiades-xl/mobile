name: Self-build iOS (Xcode 27.1, unsigned)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Xcode and SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Shared framework placeholder
        working-directory: compose
        run: ./gradlew :shared:generateDummyFramework --no-daemon --console=plain

      - name: Pod install
        working-directory: compose/iosApp
        run: pod install

      - name: Build for iPhone (Debug, unsigned)
        working-directory: compose/iosApp
        run: |
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build > "$GITHUB_WORKSPACE/xcodebuild.log" 2>&1 || true
          tail -30 "$GITHUB_WORKSPACE/xcodebuild.log"
          grep -q "BUILD SUCCEEDED" "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Errors
        if: failure()
        run: |
          grep -nE "(^|[[:space:]])e: |: error:|FAILURE:|Execution failed|OutOfMemory" xcodebuild.log | grep -v "Using response file" | tail -80 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
